# This YAML file is the declarative Router Playbook: the deterministic
# business-rules engine for the claims control plane. It evaluates CEL
# probes against the session case JSON (spine + signals) to assign work
# lanes, target agent roles, and allowed tool permissions without LLM
# decision-making.
#
# RDF/SPARQL restore: git checkout rdf-sparql-runtime (tag rdf-sparql-runtime).
# NOTE: do not use YAML key `on:` — in YAML 1.1 it is a boolean synonym for true.

# Schema + case JSON: bind the runtime to ontology/claims.json field names.
version: 1
schema_relpath: ontology/claims.json
expr: cel

# Priority evaluation order (first-match-wins):
#   Data integrity:     R0.1 claim exists, R0.4 validation triangle complete
#   Fast-path lanes:    R1.1 closed (approved) audit, R1.1d denied audit,
#                       R5.2 insured citation review, R6.* coverage exclusions,
#                       R1.2a missing docket/counsel, R1.2b discovery aging,
#                       R1.2 remaining litigation, R5.1 SIU / fraud
#   Data gaps:          R2.3 missing adjuster, R2.0 incident report number,
#                       R2.1 missing police report,
#                       R2.2 missing fault, R2.5 injury details missing
#   Financials & subro: R3.2 / R3.4 offers/payments, R4.1 / R4.3 subrogation
#   Standard review:    R1.3 bodily injury, R1.4 property damage
priorities:
  - R0.1
  - R0.4
  - R1.1
  - R1.1d
  - R5.2
  - R6.1
  - R6.2
  - R6.3
  - R1.2a
  - R1.2b
  - R1.2
  - R5.1
  - R2.3
  - R2.0
  - R2.1
  - R2.2
  - R2.5
  - R3.2
  - R3.4
  - R4.1
  - R4.3
  - R1.3
  - R1.4

# Probe registry: rule id → CEL on case JSON (ASK bool).
# User-facing copy (router emits routing_reason + checks; LLM must not invent):
#   title: check name
#   when_true / when_false: ASK outcome sentences
#   cel: expression over flattened case JSON (MCP facts; not lake SQL)
probes:
  R0.1:
    form: ASK
    title: Claim exists in the case file
    when_true: Claim is present in the case file
    when_false: Claim is missing from the case file
    cel: 'claim_exists == true'
  R0.4:
    form: ASK
    title: Policy, vehicle, and coverage triangle
    when_true: Policy, vehicle, and coverage triangle is complete
    when_false: Policy, vehicle, or coverage triangle is incomplete
    cel: 'triangle == true'
  R1.1:
    form: ASK
    title: Claim closed
    when_true: Claim is closed
    when_false: Claim is not closed
    cel: 'claim_status_code == "CLOSED"'
  R1.1d:
    form: ASK
    title: Claim denied
    when_true: Claim is denied
    when_false: Claim is not denied
    cel: 'claim_status_code == "DENIED"'
  R5.2:
    form: ASK
    title: Insured operator cited
    when_true: Insured operator was cited
    when_false: Insured operator was not cited
    cel: 'insured_operators.exists(d, d.was_cited_indicator == true)'
  R6.1:
    form: ASK
    title: Unlawful operation exclusion
    when_true: Insured operator has an unlawful-operation exclusion
    when_false: No unlawful-operation exclusion
    cel: 'insured_operators.exists(d, d.impairment_suspected_indicator == true || d.license_status_code == "SUSPENDED" || d.license_status_code == "REVOKED" || d.license_status_code == "UNLICENSED")'
  R6.2:
    form: ASK
    title: Excluded or unlisted operator
    when_true: Insured operator is excluded or unlisted
    when_false: Insured operator is listed and not excluded
    cel: 'insured_operators.exists(d, d.is_excluded_driver == true || d.on_policy == false)'
  R6.3:
    form: ASK
    title: Policy in force on loss date
    when_true: Policy was not in force on the loss date
    when_false: Policy was in force on the loss date
    cel: 'policy_status_code == "LAPSED" || policy_status_code == "CANCELLED" || policy_status_code == "EXPIRED" || (size(effective_date) > 0 && size(loss_date) > 0 && loss_date < effective_date) || (size(expiration_date) > 0 && size(loss_date) > 0 && loss_date > expiration_date) || (size(cancellation_date) > 0 && size(loss_date) > 0 && cancellation_date <= loss_date)'
  R1.2a:
    form: ASK
    title: Litigation file complete
    when_true: Litigated claim is missing docket or counsel
    when_false: Litigation file is not missing docket or counsel
    cel: '(litigation_indicator == true || has_litigation_case == true) && (size(docket_number) == 0 || (size(defense_counsel_party_id) == 0 && size(plaintiff_counsel_party_id) == 0))'
  R1.2b:
    form: ASK
    title: Discovery aging
    when_true: Discovery has been open more than 90 days
    when_false: Discovery is not aging
    cel: '(litigation_indicator == true || has_litigation_case == true) && litigation_status_code == "IN_DISCOVERY" && size(closed_date) == 0 && size(filed_date) > 0 && timestamp(filed_date + "T00:00:00Z") + duration("2160h") < timestamp(eval_date + "T00:00:00Z")'
  R1.2:
    form: ASK
    title: Remaining litigation
    when_true: Claim is in litigation
    when_false: Claim is not in remaining litigation
    cel: 'litigation_indicator == true || has_litigation_case == true'
  R1.3:
    form: ASK
    title: Bodily injury or BI liability
    when_true: Injury or BI liability coverage is present
    when_false: No injury or BI liability coverage
    cel: 'has_injury == true || coverage_type_codes.exists(c, c == "BI_LIABILITY")'
  R1.4:
    form: ASK
    title: Collision or comprehensive coverage
    when_true: Collision or comprehensive coverage is present
    when_false: No collision or comprehensive coverage
    cel: 'coverage_type_codes.exists(c, c == "COLLISION" || c == "COMPREHENSIVE")'
  R2.0:
    form: ASK
    title: Police incident report number
    when_true: Policyholder has not provided an incident report number
    when_false: Incident report number is on file
    cel: 'has_police_report == false && size(incident_report_number) == 0'
  R2.1:
    form: ASK
    title: Police report on file
    when_true: No police report on file
    when_false: Police report is on file
    cel: 'has_police_report == false'
  R2.2:
    form: ASK
    title: Fault determination on file
    when_true: No fault determination on file
    when_false: Fault determination is on file
    cel: 'has_fault_determination == false'
  R2.3:
    form: ASK
    title: Adjuster assigned
    when_true: No adjuster is assigned
    when_false: An adjuster is assigned
    cel: 'has_adjuster == false'
  R2.5:
    form: ASK
    title: Injury details for BI liability
    when_true: BI liability coverage with no injury details
    when_false: Injury details are not missing for BI liability
    cel: 'coverage_type_codes.exists(c, c == "BI_LIABILITY") && has_injury == false'
  R3.2:
    form: ASK
    title: Open settlement offer
    when_true: An extended settlement offer is still open
    when_false: No extended settlement offer is open
    cel: 'has_extended_offer == true'
  R3.4:
    form: ASK
    title: Payment after accepted offer
    when_true: Offer is accepted and no loss payment is on file
    when_false: No accepted offer waiting on a loss payment
    cel: 'has_accepted_offer == true && has_loss_payment == false'
  R4.1:
    form: ASK
    title: Subrogation case opened
    when_true: Subrogation is indicated and no case is open
    when_false: Subrogation case is not missing
    cel: 'subrogation_indicator == true && has_subrogation_case == false'
  R4.3:
    form: ASK
    title: Subrogation recovery
    when_true: Open subrogation case with no recovery
    when_false: No open subrogation case waiting on recovery
    cel: 'has_subrogation_case == true && subrogation_status_code in ["OPEN", "NEGOTIATING", "DEMANDED"] && has_recovery == false'
  R5.1:
    form: ASK
    title: SIU or fraud review
    when_true: SIU or fraud is suspected
    when_false: SIU or fraud is not suspected
    cel: 'has_siu_suspected == true'

# Action matrix: probe result (ASK_TRUE, ASK_FALSE) → execution.
#   agent:     playbook agent_role (legacy; still on the decision JSON)
#   coworker:  exact CrewAI Role for Orchestrator Delegate (omit if unmapped)
#   write:     catalog write label; specialist Goal owns the call
#   task_type_code: optional event_json for create_pd_task / create_litigation_task
#   lane/step: operational classification and next action id
#   tools:     allow-list of MCP catalog labels (and Studio graph tools)
#   letter_on_request: a letter is recommended next work; do not auto-draft
#   letter_note: copied into routing_summary (user-facing; no probe ids)
actions:
  R0.1:
    - when: ASK_FALSE
      step: FixDataQuality
      agent: DataQualityAgent
      lane: DATA_QUALITY
      write: write_audit_event
      tools: [build_claim_graph, validate_claim_graph, write_audit_event]
  R0.4:
    - when: ASK_FALSE
      step: FixDataQuality
      agent: DataQualityAgent
      lane: DATA_QUALITY
      write: write_audit_event
      tools: [build_claim_graph, validate_claim_graph, write_audit_event]
  R1.1:
    - when: ASK_TRUE
      step: CloseoutAudit
      agent: CloseoutAgent
      coworker: Closeout Agent
      lane: CLOSEOUT
      write: write_audit_event
      tools: [write_audit_event, promote_audit_run]
      terminal: true
  R1.1d:
    - when: ASK_TRUE
      step: DenyAudit
      agent: DenyAgent
      coworker: Deny Agent
      lane: DENY
      write: write_audit_event
      letter_on_request: true
      letter_note: A denial letter is recommended. It will not be drafted unless you ask.
      tools: [get_deny_view, write_audit_event, promote_audit_run, save_claim_letter]
      terminal: true
  R5.2:
    - when: ASK_TRUE
      step: HumanCitationReview
      agent: HumanReviewAgent
      coworker: Human Review Agent
      lane: GENERAL
      write: write_audit_event
      tools: [get_deny_view, write_audit_event]
      terminal: true
  R6.1:
    - when: ASK_TRUE
      step: DenyUnlawfulOperation
      agent: DenyAgent
      coworker: Deny Agent
      lane: DENY
      write: deny_claim
      letter_on_request: true
      letter_note: A denial letter is recommended. It will not be drafted unless you ask.
      tools: [get_deny_view, deny_claim, save_claim_letter]
      terminal: true
  R6.2:
    - when: ASK_TRUE
      step: DenyExcludedDriver
      agent: DenyAgent
      coworker: Deny Agent
      lane: DENY
      write: deny_claim
      letter_on_request: true
      letter_note: A denial letter is recommended. It will not be drafted unless you ask.
      tools: [get_deny_view, deny_claim, save_claim_letter]
      terminal: true
  R6.3:
    - when: ASK_TRUE
      step: DenyLapsedPolicy
      agent: DenyAgent
      coworker: Deny Agent
      lane: DENY
      write: deny_claim
      letter_on_request: true
      letter_note: A denial letter is recommended. It will not be drafted unless you ask.
      tools: [get_deny_view, deny_claim, save_claim_letter]
      terminal: true
  R1.2a:
    - when: ASK_TRUE
      step: CompleteLitigationFile
      agent: LitigationAgent
      coworker: Litigation Agent
      lane: LITIGATION
      write: create_litigation_task
      task_type_code: COMPLETE_FILE
      tools: [get_litigation_view, create_litigation_task]
  R1.2b:
    - when: ASK_TRUE
      step: EscalateDiscovery
      agent: LitigationAgent
      coworker: Litigation Agent
      lane: LITIGATION
      write: create_litigation_task
      task_type_code: ESCALATE_DISCOVERY
      tools: [get_litigation_view, create_litigation_task]
  R1.2:
    - when: ASK_TRUE
      step: LitigationSupport
      agent: LitigationAgent
      coworker: Litigation Agent
      lane: LITIGATION
      write: write_audit_event
      letter_on_request: true
      letter_note: A litigation hold/status letter is recommended. It will not be drafted unless you ask.
      tools: [get_litigation_view, write_audit_event, save_claim_letter]
  R5.1:
    - when: ASK_TRUE
      step: SiuInvestigation
      agent: SiuAgent
      lane: SIU
      write: write_audit_event
      tools: [write_audit_event]
  R2.3:
    - when: ASK_TRUE
      step: AssignAdjuster
      agent: DataQualityAgent
      lane: DATA_QUALITY
      write: write_audit_event
      tools: [build_claim_graph, write_audit_event]
  R2.0:
    - when: ASK_TRUE
      step: CollectIncidentReportNumber
      agent: PdClaimsAgent
      coworker: PD Claims Agent
      lane: PD
      write: create_pd_task
      task_type_code: COLLECT_INCIDENT_NUMBER
      letter_on_request: false
      letter_note: An SMS was sent asking the policyholder to enter the incident report number in the app.
      tools: [get_pd_view, create_pd_task, save_claim_letter]
  R2.1:
    - when: ASK_TRUE
      step: RequestPoliceReport
      agent: PdClaimsAgent
      coworker: PD Claims Agent
      lane: PD
      write: create_pd_task
      task_type_code: REQUEST_POLICE_REPORT
      letter_on_request: true
      letter_note: A police-report request letter for the incident report number is recommended. It will not be drafted unless you ask.
      tools: [get_pd_view, create_pd_task, save_claim_letter]
  R2.2:
    - when: ASK_TRUE
      step: DetermineFault
      agent: PdClaimsAgent
      coworker: PD Claims Agent
      lane: PD
      write: create_pd_task
      task_type_code: DETERMINE_FAULT
      tools: [get_pd_view, create_pd_task]
  R2.5:
    - when: ASK_TRUE
      step: CaptureInjuryDetails
      agent: BiClaimsAgent
      coworker: BI Claims Agent
      lane: BI
      write: write_audit_event
      tools: [get_bi_view, write_audit_event]
  R3.2:
    - when: ASK_TRUE
      step: FollowUpOffer
      agent: SettlementAgent
      lane: GENERAL
      write: write_audit_event
      tools: [write_audit_event]
  R3.4:
    - when: ASK_TRUE
      step: IssuePayment
      agent: SettlementAgent
      lane: GENERAL
      write: write_audit_event
      tools: [write_audit_event]
  R4.1:
    - when: ASK_TRUE
      step: OpenSubrogationCase
      agent: SubrogationAgent
      coworker: Subrogation Agent
      lane: PD
      write: write_audit_event
      tools: [get_subrogation_view, write_audit_event]
  R4.3:
    - when: ASK_TRUE
      step: PursueSubrogationRecovery
      agent: SubrogationAgent
      coworker: Subrogation Agent
      lane: PD
      write: write_audit_event
      tools: [get_subrogation_view, write_audit_event]
  R1.3:
    - when: ASK_TRUE
      step: BiClaimsReview
      agent: BiClaimsAgent
      coworker: BI Claims Agent
      lane: BI
      write: write_audit_event
      tools: [get_bi_view, write_audit_event]
  R1.4:
    - when: ASK_TRUE
      step: PdClaimsReview
      agent: PdClaimsAgent
      coworker: PD Claims Agent
      lane: PD
      write: create_pd_task
      task_type_code: PD_REVIEW
      tools: [get_pd_view, create_pd_task]

# Fallback: unhandled or ambiguous cases. No coworker → Orchestrator
# Final Answers the route JSON (do not invent a Role).
default_action:
  title: No earlier check assigned work
  step: HumanReviewOrWait
  agent: HumanReviewAgent
  lane: GENERAL
  write: write_audit_event
  tools: [write_audit_event]
  terminal: true
