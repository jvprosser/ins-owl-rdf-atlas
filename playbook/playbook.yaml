# This YAML file is the declarative Router Playbook: the deterministic
# business-rules engine for the claims control plane. It evaluates YAML
# probes against the session case JSON (spine + signals) to assign work
# lanes, target agent roles, and allowed tool permissions without LLM
# decision-making.
#
# RDF/SPARQL restore: git checkout rdf-sparql-runtime (tag rdf-sparql-runtime).
# NOTE: do not use YAML key `on:` — in YAML 1.1 it is a boolean synonym for true.

# Schema + case JSON: bind the runtime to ontology/claims.json field names.
version: 1
schema_relpath: ontology/claims.json

# Priority evaluation order (first-match-wins):
#   Data integrity:     R0.1 claim exists, R0.4 validation triangle complete
#   Fast-path lanes:    R1.1 closed audit, R1.2a missing docket/counsel,
#                       R1.2b discovery aging, R1.2 remaining litigation,
#                       R5.1 SIU / fraud
#   Data gaps:          R2.3 missing adjuster, R2.1 missing police report,
#                       R2.2 missing fault, R2.5 injury details missing
#   Financials & subro: R3.2 / R3.4 offers/payments, R4.1 / R4.3 subrogation
#   Standard review:    R1.3 bodily injury, R1.4 property damage
priorities:
  - R0.1
  - R0.4
  - R1.1
  - R1.2a
  - R1.2b
  - R1.2
  - R5.1
  - R2.3
  - R2.1
  - R2.2
  - R2.5
  - R3.2
  - R3.4
  - R4.1
  - R4.3
  - R1.3
  - R1.4

# Probe registry: rule id → YAML match on case JSON (ASK bool, SELECT path).
probes:
  # R0.1 ASK: case document built for this claim_id?
  R0.1:
    form: ASK
    match:
      path: claim_exists
      equals: true
  # R0.4 ASK: policy + vehicle + policy_covers_vehicle (triangle).
  R0.4:
    form: ASK
    match:
      path: triangle
      equals: true
  # R1.1 SELECT: claim_status_code. SELECT_EQUALS CLOSED → CloseoutAudit.
  R1.1:
    form: SELECT
    path: claim_status_code
  # R1.2a ASK: litigated claim missing docket or both counsel ids.
  R1.2a:
    form: ASK
    match:
      path: missing_docket_or_counsel
      equals: true
  # R1.2b ASK: IN_DISCOVERY more than 90 days from filed_date, still open.
  R1.2b:
    form: ASK
    match:
      path: discovery_aging
      equals: true
  # R1.2 ASK: remaining litigation (file complete, discovery not aging).
  R1.2:
    form: ASK
    match:
      any:
        - { path: litigation_indicator, equals: true }
        - { path: has_litigation_case, equals: true }
  # R1.3 ASK: injury rows or BI_LIABILITY coverage.
  R1.3:
    form: ASK
    match:
      any:
        - { path: has_injury, equals: true }
        - { path: coverage_type_codes, contains: BI_LIABILITY }
  # R1.4 ASK: COLLISION or COMPREHENSIVE coverage.
  R1.4:
    form: ASK
    match:
      any:
        - { path: coverage_type_codes, contains: COLLISION }
        - { path: coverage_type_codes, contains: COMPREHENSIVE }
  # R2.1 ASK: no police report.
  R2.1:
    form: ASK
    match:
      path: has_police_report
      equals: false
  # R2.2 ASK: no fault determination.
  R2.2:
    form: ASK
    match:
      path: has_fault_determination
      equals: false
  # R2.3 ASK: no ADJUSTER party role.
  R2.3:
    form: ASK
    match:
      path: has_adjuster
      equals: false
  # R2.5 ASK: BI_LIABILITY coverage and no injury.
  R2.5:
    form: ASK
    match:
      all:
        - { path: coverage_type_codes, contains: BI_LIABILITY }
        - { path: has_injury, equals: false }
  # R3.2 ASK: EXTENDED offer still open.
  R3.2:
    form: ASK
    match:
      path: has_extended_offer
      equals: true
  # R3.4 ASK: ACCEPTED offer and no loss payment.
  R3.4:
    form: ASK
    match:
      all:
        - { path: has_accepted_offer, equals: true }
        - { path: has_loss_payment, equals: false }
  # R4.1 ASK: subro indicated, no subrogation case.
  R4.1:
    form: ASK
    match:
      all:
        - { path: subrogation_indicator, equals: true }
        - { path: has_subrogation_case, equals: false }
  # R4.3 ASK: open subro case, no recovery.
  R4.3:
    form: ASK
    match:
      all:
        - { path: has_subrogation_case, equals: true }
        - { path: subrogation_status_code, in: [OPEN, NEGOTIATING, DEMANDED] }
        - { path: has_recovery, equals: false }
  # R5.1 ASK: SIU / fraud suspected or pending.
  R5.1:
    form: ASK
    match:
      path: has_siu_suspected
      equals: true

# Action matrix: probe result (ASK_TRUE, ASK_FALSE, SELECT_EQUALS) → execution.
#   agent:     playbook agent_role for Orchestrator handoff (e.g. SiuAgent)
#   lane/step: operational classification and next action id
#   tools:     allow-list of MCP catalog labels (and Studio graph tools) for that step
#   needs_llm: whether the step needs NL capability vs deterministic processing
actions:
  R0.1:
    - when: ASK_FALSE
      step: FixDataQuality
      agent: DataQualityAgent
      lane: DATA_QUALITY
      needs_llm: false
      tools: [build_claim_graph, validate_claim_graph, write_audit_event]
  R0.4:
    - when: ASK_FALSE
      step: FixDataQuality
      agent: DataQualityAgent
      lane: DATA_QUALITY
      needs_llm: false
      tools: [build_claim_graph, validate_claim_graph, write_audit_event]
  R1.1:
    - when: SELECT_EQUALS
      match_value: CLOSED
      step: CloseoutAudit
      agent: CloseoutAgent
      lane: CLOSEOUT
      needs_llm: false
      tools: [write_audit_event, promote_audit_run]
      terminal: true
  R1.2a:
    - when: ASK_TRUE
      step: CompleteLitigationFile
      agent: LitigationAgent
      lane: LITIGATION
      needs_llm: false
      tools: [get_litigation_view, create_litigation_task]
  R1.2b:
    - when: ASK_TRUE
      step: EscalateDiscovery
      agent: LitigationAgent
      lane: LITIGATION
      needs_llm: false
      tools: [get_litigation_view, create_litigation_task]
  R1.2:
    - when: ASK_TRUE
      step: LitigationSupport
      agent: LitigationAgent
      lane: LITIGATION
      needs_llm: true
      tools: [get_litigation_view, write_audit_event, save_claim_letter]
  R5.1:
    - when: ASK_TRUE
      step: SiuInvestigation
      agent: SiuAgent
      lane: SIU
      needs_llm: false
      tools: [write_audit_event]
  R2.3:
    - when: ASK_TRUE
      step: AssignAdjuster
      agent: DataQualityAgent
      lane: DATA_QUALITY
      needs_llm: false
      tools: [build_claim_graph, write_audit_event]
  R2.1:
    - when: ASK_TRUE
      step: RequestPoliceReport
      agent: PdClaimsAgent
      lane: PD
      needs_llm: true
      tools: [get_pd_view, create_pd_task, save_claim_letter]
  R2.2:
    - when: ASK_TRUE
      step: DetermineFault
      agent: PdClaimsAgent
      lane: PD
      needs_llm: false
      tools: [get_pd_view, create_pd_task]
  R2.5:
    - when: ASK_TRUE
      step: CaptureInjuryDetails
      agent: BiClaimsAgent
      lane: BI
      needs_llm: true
      tools: [get_bi_view, write_audit_event]
  R3.2:
    - when: ASK_TRUE
      step: FollowUpOffer
      agent: SettlementAgent
      lane: GENERAL
      needs_llm: false
      tools: [write_audit_event]
  R3.4:
    - when: ASK_TRUE
      step: IssuePayment
      agent: SettlementAgent
      lane: GENERAL
      needs_llm: false
      tools: [write_audit_event]
  R4.1:
    - when: ASK_TRUE
      step: OpenSubrogationCase
      agent: SubrogationAgent
      lane: PD
      needs_llm: false
      tools: [get_subrogation_view, write_audit_event]
  R4.3:
    - when: ASK_TRUE
      step: PursueSubrogationRecovery
      agent: SubrogationAgent
      lane: PD
      needs_llm: false
      tools: [get_subrogation_view, write_audit_event]
  R1.3:
    - when: ASK_TRUE
      step: BiClaimsReview
      agent: BiClaimsAgent
      lane: BI
      needs_llm: false
      tools: [get_bi_view, write_audit_event]
  R1.4:
    - when: ASK_TRUE
      step: PdClaimsReview
      agent: PdClaimsAgent
      lane: PD
      needs_llm: false
      tools: [get_pd_view, create_pd_task]

# Fallback: unhandled or ambiguous cases → HumanReviewAgent, GENERAL lane,
# terminal: true.
default_action:
  step: HumanReviewOrWait
  agent: HumanReviewAgent
  lane: GENERAL
  needs_llm: false
  tools: [write_audit_event]
  terminal: true
