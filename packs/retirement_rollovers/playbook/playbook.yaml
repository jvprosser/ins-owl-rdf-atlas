# This YAML file is the declarative Router Playbook: the deterministic
# business-rules engine for retirement rollover / ERISA requests. It
# evaluates YAML probes against the session case JSON to assign work
# lanes, target agent roles, and allowed tool permissions without LLM
# decision-making.
#
# RDF/SPARQL restore: git checkout rdf-sparql-runtime.
# NOTE: do not use YAML key `on:` — in YAML 1.1 it is a boolean synonym for true.

# Schema: ontology/rollovers.json field names (lake JSON keys).
version: 1
schema_relpath: ontology/rollovers.json

# Priority evaluation order (first-match-wins):
#   Data integrity:  R0.1 request exists as RolloverRequest
#   Fast-path:       R1.1 closed → closeout audit
#   Completeness:    R2.1 missing spousal consent (ERISA),
#                    R2.2 missing required documents
# Unmatched open requests fall through to ProcessRollover.
priorities:
  - R0.1
  - R1.1
  - R2.1
  - R2.2

# Probe registry: YAML match on case JSON.
# User-facing copy (router emits routing_reason + checks; LLM must not invent).
probes:
  R0.1:
    form: ASK
    title: Rollover request exists in the case file
    when_true: Rollover request is present in the case file
    when_false: Rollover request is missing from the case file
    match:
      path: case_exists
      equals: true
  R1.1:
    form: SELECT
    path: request_status_code
    title: Request closed
    when_equals: Request is closed
    otherwise: Request is not closed (status {value})
  R2.1:
    form: ASK
    title: Spousal consent
    when_true: Required spousal consent is missing
    when_false: Spousal consent is not missing
    match:
      path: missing_spousal_consent
      equals: true
  R2.2:
    form: ASK
    title: Required documents
    when_true: Required documents are missing
    when_false: Required documents are not missing
    match:
      path: missing_required_docs
      equals: true

# Action matrix: probe result (ASK_TRUE, ASK_FALSE, SELECT_EQUALS) → execution.
#   agent:     playbook agent_role for Orchestrator handoff
#   lane/step: operational classification and next action id
#   tools:     allow-list of MCP catalog labels (and Studio graph tools) for that step
actions:
  R0.1:
    - when: ASK_FALSE
      step: FixDataQuality
      agent: DataQualityAgent
      lane: DATA_QUALITY
      tools: [build_claim_graph, validate_claim_graph, write_audit_event]
  R1.1:
    - when: SELECT_EQUALS
      match_value: CLOSED
      step: CloseoutAudit
      agent: CloseoutAgent
      lane: CLOSEOUT
      tools: [write_audit_event, promote_audit_run]
      terminal: true
  R2.1:
    - when: ASK_TRUE
      step: ErisaReview
      agent: ErisaReviewAgent
      lane: ERISA
      tools: [get_erisa_review_view, write_audit_event]
  R2.2:
    - when: ASK_TRUE
      step: RequestDocuments
      agent: ExceptionQueueAgent
      lane: EXCEPTION
      tools: [write_audit_event]

# Fallback: no ERISA/doc gap → ProcessRollover / RolloverOpsAgent
# (demo 8002), terminal: true.
default_action:
  title: No earlier check assigned work
  step: ProcessRollover
  agent: RolloverOpsAgent
  lane: ROLLOVER
  tools: [write_audit_event]
  terminal: true
