    - loss_run_needs_review
    - large_loss_present
    - large_loss_needs_review
    - tenant_roster_present
    - tenant_roster_needs_review
catalog:
  mcp: iceberg-mcp-server-underwriting
  database: underwriting
  fixture_writes: false
  notes: Labels compiled in iceberg-mcp-server-underwriting. fixtures/ remain golden for agent_studio/tests/test_underwriting_pack.py. Studio claim_id is the numeric submission id (9200).
  reads:
    get_submission_spine:
      required: [claim_id]
      fixture_dir: fixtures/get_submission_spine
    get_submission_routing_signals:
      required: [claim_id]
      fixture_dir: fixtures/get_submission_routing_signals
    get_senior_uw_referral_context:
      required: [claim_id]
      fixture_dir: fixtures/get_senior_uw_referral_context
    list_underwriter_open_submissions:
      required: [party_id]
