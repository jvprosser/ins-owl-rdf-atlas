# Declarative router for underwriting submissions. CEL on the session case
# JSON chooses the lane. The LLM does not invent appetite, referral, or price.
#
# NOTE: do not use YAML key `on:` — in YAML 1.1 it is a boolean synonym for true.

version: "2.9.0"
schema_relpath: ontology/submissions.json

# First match:
#   R0.1 submission exists
#   P0C low OCR word confidence, before appetite
#   P0V statement of values coinsurance or a blank schedule line
#   P0W rental value worksheet does not foot or disagrees with the schedule
#   P0I 4-point inspection is incomplete, disagrees on year built, or reports aluminum or polybutylene
#   P0L loss run is unsigned or its totals do not foot
#   P0N large loss narrative does not match its invoice, or falls in a clean loss run
#   P0T tenant roster does not foot, disagrees with the rent roll, or describes commercial cooking
#   P00 prohibited NAICS, P01 OFAC, P02 adverse loss history
#   U0 no current underwriter
#   P10 SIU, P20 inspection, P21 CAT model
#   P30 high value or construction, P31 protection class
#   P40 straight-through bind
# Unmatched files fall through to manual triage.
priorities:
  - R0.1
  - P0C_LOW_OCR_CONFIDENCE
  - P0V_SOV_SCHEDULE
  - P0W_RENTAL_VALUE_WORKSHEET
  - P0I_FOUR_POINT_INSPECTION
  - P0L_LOSS_RUN
  - P0N_LARGE_LOSS_NARRATIVE
  - P0T_TENANT_ROSTER
  - P00_PROHIBITED_CLASS_CODE
  - P01_SANCTIONS_AND_OFAC_FLAG
  - P02_EXCESSIVE_LOSS_FREQUENCY
  - U0_ASSIGN_UNDERWRITER
  - P10_SIU_HIGH_RISK_TRIGGER
  - P20_HIGH_TIV_REQUIRES_RISK_ENGINEERING
  - P21_COASTAL_CONVECTIVE_CAT_MODEL_MISSING
  - P30_HIGH_VALUE_OR_NON_STANDARD_CONSTRUCTION
  - P31_SUBSTANDARD_PROTECTION_CLASS
  - P40_ELIGIBLE_FOR_CLEAN_AUTO_BIND

probes:
  R0.1:
    form: ASK
    title: Submission exists in the case file
    when_true: Submission is present in the case file
    when_false: Submission is missing from the case file
    cel: 'case_exists == true'
  P0C_LOW_OCR_CONFIDENCE:
    form: ASK
    title: Scanned ACORD word confidence below the review line
    when_true: A scanned word is below 0.8
    when_false: No scan is on file, or every scored word is at or above 0.8
    cel: 'ocr_document_present == true && min_ocr_confidence < 0.8'
  P0V_SOV_SCHEDULE:
    form: ASK
    title: Statement of values coinsurance or a blank coverage line
    when_true: A percent coinsurance is under 80, or the schedule has no building line, a blank limit, or a blank coinsurance
    when_false: No schedule is on file, or percent coinsurance is at least 80 and every line is filled in
    cel: 'sov_present == true && (sov_schedule_incomplete == true || (sov_min_coinsurance_pct > 0.0 && sov_min_coinsurance_pct < 80.0))'
  P0W_RENTAL_VALUE_WORKSHEET:
    form: ASK
    title: Rental value worksheet does not foot or disagrees with the schedule
    when_true: The worksheet math, rent roll, selected limit, monthly limitation, or area disagrees
    when_false: No worksheet is on file, or it foots and agrees with the business income schedule
    cel: 'rental_worksheet_present == true && rental_needs_review == true'
  P0I_FOUR_POINT_INSPECTION:
    form: ASK
    title: 4-point inspection is incomplete or reports a prohibited system
    when_true: A system row is missing, year built disagrees with the schedule, or the notes report aluminum wiring or polybutylene
    when_false: No 4-point inspection is on file, or roof, plumbing, electrical, and HVAC are present and the year matches
    cel: 'four_point_present == true && four_point_needs_review == true'
  P0L_LOSS_RUN:
    form: ASK
    title: Loss run is unsigned or its totals do not foot
    when_true: The loss run has no authorized signature, or the policy totals do not match the account aggregate
    when_false: No loss run is on file, or it is signed and the policy totals match the aggregate
    cel: 'loss_run_present == true && loss_run_needs_review == true'
  P0N_LARGE_LOSS_NARRATIVE:
    form: ASK
    title: Large loss narrative does not match its invoice or the loss run
    when_true: The narrative is unsigned, the invoice does not foot or is unpaid, or the loss date falls in a loss run that shows no losses
    when_false: No narrative is on file, or it is signed, paid, and outside any clean loss-run term
    cel: 'large_loss_present == true && large_loss_needs_review == true'
  P0T_TENANT_ROSTER:
    form: ASK
    title: Tenant roster does not foot or disagrees with the rent roll
    when_true: The roster is unsigned, the areas do not foot, a unit disagrees with the rent roll, or a tenant describes commercial cooking
    when_false: No roster is on file, or it is signed, fully occupied, and matches the rent roll
    cel: 'tenant_roster_present == true && tenant_roster_needs_review == true'
  P00_PROHIBITED_CLASS_CODE:
    form: ASK
    title: Industry class outside carrier underwriting appetite guidelines
    when_true: NAICS code is outside appetite
    when_false: NAICS code is inside appetite
    cel: '["325120", "325920", "713210", "424710"].exists(c, c == naics_code)'
  P01_SANCTIONS_AND_OFAC_FLAG:
    form: ASK
    title: OFAC/Sanctions watchlist hit on applicant or beneficial owners
    when_true: An OFAC match is present
    when_false: No OFAC match is present
    cel: 'has_ofac_match == true'
  P02_EXCESSIVE_LOSS_FREQUENCY:
    form: ASK
    title: Loss history exceeds standard appetite (3+ paid property losses in 36mo)
    when_true: Three or more property losses in 36 months, or incurred losses over 750000
    when_false: Loss frequency and incurred losses are inside appetite
    cel: 'claims_count_36m >= 3 || total_incurred_36m > 750000'
  U0_ASSIGN_UNDERWRITER:
    form: ASK
    title: Current underwriter assignment
    when_true: No underwriter is currently assigned
    when_false: A current underwriter is assigned
    cel: 'has_underwriter == false'
  P10_SIU_HIGH_RISK_TRIGGER:
    form: ASK
    title: National underwriting database moral hazard or SIU referral score
    when_true: SIU score is over 85 or a tax lien is unresolved
    when_false: SIU score is at or under 85 and no unresolved tax lien is present
    cel: 'siu_score > 85 || tax_lien_unresolved == true'
  P20_HIGH_TIV_REQUIRES_RISK_ENGINEERING:
    form: ASK
    title: Total Insured Value exceeds $5M without verified engineering inspection within 24m
    when_true: TIV is over 5000000 and no survey is on file or the survey is older than 24 months
    when_false: TIV is at or under 5000000, or a survey from the last 24 months is on file
    cel: 'total_insured_value > 5000000 && (has_survey_on_file == false || survey_age_months > 24)'
  P21_COASTAL_CONVECTIVE_CAT_MODEL_MISSING:
    form: ASK
    title: High-exposure CAT zones requiring stochastic RMS/AIR catastrophe loss run
    when_true: Wind tier is 1 or 2 and no recent CAT run is on file
    when_false: Wind tier is outside 1 and 2, or a recent CAT run is on file
    cel: '(wind_tier == 1.0 || wind_tier == 2.0) && has_recent_cat_run == false'
  P30_HIGH_VALUE_OR_NON_STANDARD_CONSTRUCTION:
    form: ASK
    title: TIV > $10M, frame construction > $2.5M, or older unprotected wiring
    when_true: TIV, frame construction, or wiring requires a senior underwriter
    when_false: Value, construction, and wiring are inside frontline authority
    cel: 'total_insured_value > 10000000 || (construction_type == "FRAME" && total_insured_value > 2500000) || (year_built > 0 && year_built < 1975 && wiring_updated == false)'
  P31_SUBSTANDARD_PROTECTION_CLASS:
    form: ASK
    title: Public Protection Class (PPC) 8-10 or lack of functional sprinkler system
    when_true: Protection class is 8, 9, or 10, or a building over 20000 square feet has no sprinklers
    when_false: Protection class and sprinklers are inside frontline authority
    cel: '["8", "9", "10"].exists(c, c == protection_class) || (has_sprinklers == false && square_footage > 20000)'
  P40_ELIGIBLE_FOR_CLEAN_AUTO_BIND:
    form: ASK
    title: Preferred risk meeting all frontline parameters for automated rating
    when_true: TIV, loss history, financial score, and flood zone meet straight-through terms
    when_false: Straight-through terms are not met
    cel: 'total_insured_value <= 5000000 && claims_count_36m == 0.0 && financial_score >= 680 && !(["A", "V"].exists(z, z == flood_zone))'

actions:
  R0.1:
    - when: ASK_FALSE
      step: FixDataQuality
      agent: DataQualityAgent
      lane: DATA_QUALITY
      write: write_audit_event
      tools: [build_claim_graph, validate_claim_graph, write_audit_event]
  P0C_LOW_OCR_CONFIDENCE:
    - when: ASK_TRUE
      step: RESOLVE_LOW_CONFIDENCE_OCR
      agent: UnderwritingReviewAgent
      coworker: Underwriting Review Agent
      lane: REVIEW
      write: write_audit_event
      tools: [write_audit_event]
      terminal: true
      letter_on_request: false
  P0V_SOV_SCHEDULE:
    - when: ASK_TRUE
      step: RESOLVE_SOV_SCHEDULE
      agent: UnderwritingReviewAgent
      coworker: Underwriting Review Agent
      lane: REVIEW
      write: write_audit_event
      tools: [write_audit_event]
      terminal: true
      letter_on_request: false
  P0W_RENTAL_VALUE_WORKSHEET:
    - when: ASK_TRUE
      step: RESOLVE_RENTAL_VALUE_WORKSHEET
      agent: UnderwritingReviewAgent
      coworker: Underwriting Review Agent
      lane: REVIEW
      write: write_audit_event
      tools: [write_audit_event]
      terminal: true
      letter_on_request: false
  P0I_FOUR_POINT_INSPECTION:
    - when: ASK_TRUE
      step: RESOLVE_FOUR_POINT_INSPECTION
      agent: UnderwritingReviewAgent
      coworker: Underwriting Review Agent
      lane: REVIEW
      write: write_audit_event
      tools: [write_audit_event]
      terminal: true
      letter_on_request: false
  P0L_LOSS_RUN:
    - when: ASK_TRUE
      step: RESOLVE_LOSS_RUN
      agent: UnderwritingReviewAgent
      coworker: Underwriting Review Agent
      lane: REVIEW
      write: write_audit_event
      tools: [write_audit_event]
      terminal: true
      letter_on_request: false
  P0N_LARGE_LOSS_NARRATIVE:
    - when: ASK_TRUE
      step: RESOLVE_LARGE_LOSS_NARRATIVE
      agent: UnderwritingReviewAgent
      coworker: Underwriting Review Agent
      lane: REVIEW
      write: write_audit_event
      tools: [write_audit_event]
      terminal: true
      letter_on_request: false
  P0T_TENANT_ROSTER:
    - when: ASK_TRUE
      step: RESOLVE_TENANT_ROSTER
      agent: UnderwritingReviewAgent
      coworker: Underwriting Review Agent
      lane: REVIEW
      write: write_audit_event
      tools: [write_audit_event]
      terminal: true
      letter_on_request: false
  P00_PROHIBITED_CLASS_CODE:
    - when: ASK_TRUE
      step: DECLINE_UNINSURABLE_CLASS
      agent: UnderwritingIntakeSpecialist
      coworker: Underwriting Intake Specialist
      lane: DECLINE
      write: write_submission_decline
      reason_code: OUT_OF_APPETITE
      letter_on_request: true
      tools: [write_submission_decline, save_claim_letter]
      terminal: true
  P01_SANCTIONS_AND_OFAC_FLAG:
    - when: ASK_TRUE
      step: HOLD_COMPLIANCE_FREEZE
      agent: UnderwritingReviewAgent
      coworker: Underwriting Review Agent
      lane: REVIEW
      write: write_audit_event
      tools: [write_audit_event]
      terminal: true
      letter_on_request: false
  P02_EXCESSIVE_LOSS_FREQUENCY:
    - when: ASK_TRUE
      step: DECLINE_ADVERSE_LOSS_HISTORY
      agent: UnderwritingIntakeSpecialist
      coworker: Underwriting Intake Specialist
      lane: DECLINE
      write: write_submission_decline
      reason_code: OUT_OF_APPETITE
      letter_on_request: true
      tools: [write_submission_decline, save_claim_letter]
      terminal: true
  U0_ASSIGN_UNDERWRITER:
    - when: ASK_TRUE
      step: AssignUnderwriter
      agent: DataQualityAgent
      lane: DATA_QUALITY
      write: write_audit_event
      tools: [build_claim_graph, write_audit_event]
  P10_SIU_HIGH_RISK_TRIGGER:
    - when: ASK_TRUE
      step: REFER_TO_SPECIAL_INVESTIGATIONS
      agent: UnderwritingReviewAgent
      coworker: Underwriting Review Agent
      lane: REVIEW
      write: write_audit_event
      tools: [write_audit_event]
      terminal: false
      letter_on_request: false
  P20_HIGH_TIV_REQUIRES_RISK_ENGINEERING:
    - when: ASK_TRUE
      step: ORDER_RISK_ENGINEERING_SURVEY
      agent: RiskEngineeringSpecialist
      coworker: Risk Engineering Specialist
      lane: ENRICHMENT
      write: write_data_enrichment_request
      task_type_code: INSPECTION
      tools: [write_data_enrichment_request]
      terminal: false
      letter_on_request: false
  P21_COASTAL_CONVECTIVE_CAT_MODEL_MISSING:
    - when: ASK_TRUE
      step: TRIGGER_CAT_MODEL_RUN
      agent: RiskEngineeringSpecialist
      coworker: Risk Engineering Specialist
      lane: ENRICHMENT
      write: write_audit_event
      tools: [write_audit_event]
      terminal: false
      letter_on_request: false
  P30_HIGH_VALUE_OR_NON_STANDARD_CONSTRUCTION:
    - when: ASK_TRUE
      step: REFER_SENIOR_PROPERTY_UW
      agent: SeniorUnderwriter
      coworker: Senior Underwriter
      lane: REFERRAL
      write: write_referral_queue
      tools: [get_senior_uw_referral_context, write_referral_queue]
      terminal: false
      letter_on_request: false
  P31_SUBSTANDARD_PROTECTION_CLASS:
    - when: ASK_TRUE
      step: REFER_PROPERTY_FACULTATIVE_DESK
      agent: SeniorUnderwriter
      coworker: Senior Underwriter
      lane: REFERRAL
      write: write_referral_queue
      tools: [get_senior_uw_referral_context, write_referral_queue]
      terminal: false
      letter_on_request: false
  P40_ELIGIBLE_FOR_CLEAN_AUTO_BIND:
    - when: ASK_TRUE
      step: EXECUTE_AUTOMATED_BIND_AND_QUOTE
      agent: RatingSpecialist
      coworker: Rating Specialist
      lane: BIND
      write: write_quote_issuance
      tools: [write_quote_issuance]
      terminal: true
      letter_on_request: true

default_action:
  title: No earlier check assigned work
  step: HOLD_FOR_MANUAL_TRIAGE
  agent: UnderwritingReviewAgent
  coworker: Underwriting Review Agent
  lane: REVIEW
  write: write_audit_event
  tools: [write_audit_event]
  terminal: false
  letter_on_request: false
