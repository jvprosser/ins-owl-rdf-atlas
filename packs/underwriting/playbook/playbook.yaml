# Declarative router for underwriting submissions. CEL on the session case
# JSON chooses the lane. The LLM does not invent appetite, referral, or price.
#
# NOTE: do not use YAML key `on:` — in YAML 1.1 it is a boolean synonym for true.

version: "1.0.0"
schema_relpath: ontology/submissions.json

# First match:
#   R0.1 submission exists
#   P0 prohibited class or TIV over $25M
#   U0 no current underwriter (after coded decline, before operational work)
#   P1 TIV over $2M and inspection not complete
#   P2 flood plain or 3+ prior claims
#   P3 clean straight-through bind
# Unmatched open files fall through to human underwriter review.
priorities:
  - R0.1
  - P0_OUT_OF_APPETITE
  - U0_ASSIGN_UNDERWRITER
  - P1_AWAITING_INSPECTION
  - P2_SENIOR_UW_ESCALATION
  - P3_STRAIGHT_THROUGH_BIND

probes:
  R0.1:
    form: ASK
    title: Submission exists in the case file
    when_true: Submission is present in the case file
    when_false: Submission is missing from the case file
    cel: 'case_exists == true'
  P0_OUT_OF_APPETITE:
    form: ASK
    title: Out of appetite
    when_true: Class code is prohibited or total insured value is over $25,000,000
    when_false: Class code is in appetite and total insured value is at or under $25,000,000
    cel: '["4812", "5921"].exists(c, c == class_code) || total_insured_value > 25000000'
  U0_ASSIGN_UNDERWRITER:
    form: ASK
    title: Current underwriter assignment
    when_true: No underwriter is currently assigned
    when_false: A current underwriter is assigned
    cel: 'has_underwriter == false'
  P1_AWAITING_INSPECTION:
    form: ASK
    title: Awaiting inspection
    when_true: Total insured value is over $2,000,000 and inspection is not complete
    when_false: Inspection is complete or total insured value is at or under $2,000,000
    cel: 'total_insured_value > 2000000 && inspection_completed == false'
  P2_SENIOR_UW_ESCALATION:
    form: ASK
    title: Senior underwriter escalation
    when_true: Property is in a flood plain or prior claims are 3 or more
    when_false: Property is not in a flood plain and prior claims are under 3
    cel: 'is_in_flood_plain == true || prior_claims_count >= 3'
  P3_STRAIGHT_THROUGH_BIND:
    form: ASK
    title: Straight-through bind
    when_true: Not in a flood plain and there are no prior claims
    when_false: Flood plain or prior claims block straight-through bind
    cel: 'is_in_flood_plain == false && prior_claims_count == 0.0'

actions:
  R0.1:
    - when: ASK_FALSE
      step: FixDataQuality
      agent: DataQualityAgent
      lane: DATA_QUALITY
      write: write_audit_event
      tools: [build_claim_graph, validate_claim_graph, write_audit_event]
  P0_OUT_OF_APPETITE:
    - when: ASK_TRUE
      step: DECLINE_UNINSURABLE
      agent: UnderwritingIntakeSpecialist
      coworker: Underwriting Intake Specialist
      lane: DECLINE
      write: write_submission_decline
      reason_code: OUT_OF_APPETITE
      letter_on_request: true
      tools: [write_submission_decline, save_claim_letter]
      terminal: true
  U0_ASSIGN_UNDERWRITER:
    - when: ASK_TRUE
      step: AssignUnderwriter
      agent: DataQualityAgent
      lane: DATA_QUALITY
      write: write_audit_event
      tools: [build_claim_graph, write_audit_event]
  P1_AWAITING_INSPECTION:
    - when: ASK_TRUE
      step: TRIGGER_SURVEY
      agent: RiskEngineeringSpecialist
      coworker: Risk Engineering Specialist
      lane: ENRICHMENT
      write: write_data_enrichment_request
      task_type_code: INSPECTION
      tools: [write_data_enrichment_request]
      terminal: false
  P2_SENIOR_UW_ESCALATION:
    - when: ASK_TRUE
      step: REFER_TO_SENIOR_UW
      agent: SeniorUnderwriter
      coworker: Senior Underwriter
      lane: REFERRAL
      write: write_referral_queue
      tools: [get_senior_uw_referral_context, write_referral_queue]
      terminal: false
  P3_STRAIGHT_THROUGH_BIND:
    - when: ASK_TRUE
      step: AUTO_RATE_AND_BIND
      agent: RatingSpecialist
      coworker: Rating Specialist
      lane: BIND
      write: write_quote_issuance
      tools: [write_quote_issuance]
      terminal: true

default_action:
  title: No earlier check assigned work
  step: HUMAN_UW_REVIEW
  agent: UnderwritingReviewAgent
  coworker: Underwriting Review Agent
  lane: REVIEW
  write: write_audit_event
  tools: [write_audit_event]
  terminal: false
