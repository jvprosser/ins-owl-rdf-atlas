id: retirement_distributions
case_id_param: claim_id
ontology: ontology/distributions.json
playbook: playbook/playbook.yaml
exemplars: exemplars.yaml
cosine_labels:
  - DISTRIBUTION
  - EXCEPTION
  - RMD
  - COMPLIANCE
  - COMMUNICATION
graph:
  builder: generic
  case_class: DistributionRequest
  literals:
    - request_status_code
    - distribution_type_code
    - plan_id
    - participant_id
    - hardship_category
    - participant_marital_status
  booleans:
    - hold_or_aml_flag
    - has_participant_self_certified
    - requires_substantiation_audit
    - plan_subject_to_qjsa
    - plan_mandates_loan_exhaustion
    - spousal_consent_verified
    - has_active_qdro_hold
catalog:
  mcp: iceberg-mcp-server-finserv
  database: retirement_distributions
  fixture_writes: false
  notes: Labels compiled in iceberg-mcp-server-finserv. fixtures/ remain golden for agent_studio/tests/test_packs.py.
  reads:
    get_distribution_spine:
      required: [claim_id]
      fixture_dir: fixtures/get_distribution_spine
    get_distribution_routing_signals:
      required: [claim_id]
      fixture_dir: fixtures/get_distribution_routing_signals
    get_distribution_exception_view:
      required: [claim_id]
      fixture_dir: fixtures/get_distribution_exception_view
    get_rmd_view:
      required: [claim_id]
      fixture_dir: fixtures/get_rmd_view
    get_compliance_view:
      required: [claim_id]
      fixture_dir: fixtures/get_compliance_view
    get_loan_summary_view:
      required: [claim_id]
      fixture_dir: fixtures/get_loan_summary_view
    get_qdro_details_view:
      required: [claim_id]
      fixture_dir: fixtures/get_qdro_details_view
