# Deterministic distribution routing. Do not use YAML key `on:`.
version: 1
ontology_relpath: ontology/distributions.ttl
probes_relpath: probes
iri_base: https://example.org/ins/
case_iri_template: https://example.org/ins/id/DistributionRequest/{case_id}

loop:
  max_route_passes: 4
  no_progress_limit: 2

priorities:
  - R0.1
  - R1.1
  - R2.1
  - R2.2
  - R2.3

probes:
  R0.1:
    file: R0_1_request_exists.rq
    form: ASK
  R1.1:
    file: R1_1_request_status.rq
    form: SELECT
  R2.1:
    file: R2_1_hold_or_aml.rq
    form: ASK
  R2.2:
    file: R2_2_hardship_substantiation_missing.rq
    form: ASK
  R2.3:
    file: R2_3_rmd_underpaid.rq
    form: ASK

actions:
  R0.1:
    - when: ASK_FALSE
      step: FixDataQuality
      agent: DataQualityAgent
      lane: DATA_QUALITY
      needs_llm: false
      tools: [build_claim_graph, validate_claim_graph, write_audit_event]
  R1.1:
    - when: SELECT_EQUALS
      match_value: CLOSED
      step: CloseoutAudit
      agent: CloseoutAgent
      lane: CLOSEOUT
      needs_llm: false
      tools: [write_audit_event, promote_audit_run]
      terminal: true
  R2.1:
    - when: ASK_TRUE
      step: HoldReview
      agent: ExceptionQueueAgent
      lane: EXCEPTION
      needs_llm: false
      tools: [get_distribution_exception_view, write_audit_event]
  R2.2:
    - when: ASK_TRUE
      step: RequestSubstantiation
      agent: ExceptionQueueAgent
      lane: EXCEPTION
      needs_llm: false
      tools: [get_distribution_exception_view, write_audit_event]
  R2.3:
    - when: ASK_TRUE
      step: RmdReview
      agent: RmdOpsAgent
      lane: RMD
      needs_llm: false
      tools: [get_rmd_view, write_audit_event]

default_action:
  step: ProcessDistribution
  agent: DistributionOpsAgent
  lane: DISTRIBUTION
  needs_llm: false
  tools: [write_audit_event]
  terminal: true
