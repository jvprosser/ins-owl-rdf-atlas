[project]
name = "ins-claims-agent"
version = "0.1.0"
description = "Cloudera Agent Studio tools for JSON/YAML claim routing over Iceberg MCP"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.24",
  "cel-python>=0.3.0,<0.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ins_claims_agent"]

[tool.hatch.build.targets.wheel.sources]
"src/ins_claims_agent" = "ins_claims_agent"

[tool.hatch.build.targets.wheel.force-include]
"src/ins_claims_agent/pre_router/exemplars.yaml" = "ins_claims_agent/pre_router/exemplars.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
